<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tienda | TANPURA</title>
  <meta name="description" content="Sitio oficial de Tanpura, banda de rock argentino. Escuchá nuestra música, enterate de las próximas fechas, leé las letras del álbum Coraza Medieval y conocé a los integrantes.">
  <meta name="keywords" content="Tanpura, rock argentino, rock nacional, Coraza Medieval, musica, guitarra, bajo, bateria, Hurlingham, Tres de Febrero">
  <link rel="icon" href="../img/logo.png" type="image/png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" />
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg">
      <div class="container-fluid">
        <a class="navbar-brand" href="../index.html">TANPURA</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
          <div class="navbar-nav">
              <a class="nav-link" aria-current="page" href="../index.html">Inicio</a>
              <a class="nav-link" href="nosotros.html">Nosotros</a>
              <a class="nav-link" href="musica.html">Canciones</a>
              <a class="nav-link" href="galeria.html">Galeria</a>
              <a class="nav-link" href="playlist.html">Playlist</a>
              <a class="nav-link" href="tienda.html">Tienda</a>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <main class="tienda">
    <h1 class="tienda__titulo">Tienda TANPURA</h1>

    <section class="tienda__catalogo-wrapper">
      <div class="tienda__filtros">
        <label for="filtro-categoria">Categoría:</label>
        <select id="filtro-categoria">
          <option value="todas">Todas</option>
          <option value="indumentaria">Indumentaria</option>
          <option value="música">Música</option>
          <option value="accesorios">Accesorios</option>
        </select>
      </div>

      <p id="spinner-carga" class="oculto">Cargando productos...</p>

      <div id="catalogo" class="catalogo"></div>
    </section>

    <aside class="carrito" aria-label="Carrito de compras">
      <h2>
        Carrito
        <span id="contador-carrito">0</span>
      </h2>

      <div id="items-carrito"></div>

      <p class="carrito__total">
        Total: <span id="total-carrito">$0</span>
      </p>

      <div class="carrito__acciones">
        <button id="vaciar-carrito" class="boton boton--vaciar">
          Vaciar carrito
        </button>
        <button id="finalizar-compra" class="boton boton--finalizar" disabled>
          Finalizar compra
        </button>
      </div>
    </aside>
  </main>

  <footer class="footer-tanpura py-5">
    <div class="container">
      <div class="row align-items-center">
        <div class="col-md-4 text-center text-md-start mb-4 mb-md-0">
          <a href="../index.html" class="footer-brand">
            <span class="h2 mb-0">TANPURA</span>
          </a>
        </div>

        <div class="col-md-4 text-center mb-4 mb-md-0">
            <div class="footer-socials d-flex justify-content-center gap-4">
            <a href="https://www.instagram.com/tanpura.rock?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw%3D%3D" target="_blank"><i class="bi bi-instagram">Instagram</i></a>
            <a href="https://open.spotify.com/intl-es/artist/46CbSU2wu25oBrKRY6xEuV?si=2NHfHm6ER0C6GiOPnp21iQ" target="_blank"><i class="bi bi-spotify">Spotify</i></a>
            <a href="https://www.youtube.com/channel/UClNT9Lipk2wIPx6X3C-goBA" target="_blank"><i class="bi bi-youtube">YouTube</i></a>
            </div>
        </div>

        <div class="col-md-4 text-center text-md-end text-secondary">
          <p class="mb-0 small">&copy; 2026 Tanpura Rock.</p>
          <p class="mb-0 extra-small">Hecho en el Conurbano.</p>
        </div>

      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

  <script src="../ui.js"></script>
  <script src="../carrito.js"></script>
  <script src="../app.js"></script>
</body>
</html>
